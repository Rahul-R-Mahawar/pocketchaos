# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets are never stored here. Values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is first applied; JWT_SECRET is generated by Render.
services:
  - type: web
    name: pocketchaos-backend
    runtime: node
    rootDir: backend
    # --include=dev: NODE_ENV=production below would otherwise make npm skip TypeScript, which the build needs.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1" # one reverse-proxy hop on Render, so rate limits see real client IPs
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false # e.g. a MongoDB Atlas mongodb+srv:// connection string
      - key: CORS_ORIGINS
        sync: false # comma-separated browser origins: the dashboard and the mobile web preview

  - type: web
    name: pocketchaos-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # the backend origin, e.g. https://pocketchaos-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # The Expo app built for the browser: a clickable preview of the mobile companion.
  - type: web
    name: pocketchaos-mobile-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false # the backend origin; makes the Cloud preset the default
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
